name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valores de fachada: nenhum passo do CI conecta em banco real.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  AUTH_SECRET: ci-secret-com-mais-de-trinta-e-dois-caracteres-para-passar
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  verify:
    name: Tipos, lint, fronteiras e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Validar schema do banco
        run: npx prisma validate

      # ── As quatro barreiras que sustentam a Constituição ──────────────────
      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Violação de fronteira quebra o build. É o que impede a erosão da
      # arquitetura ao longo dos anos (docs/01 §1).
      - name: Fronteiras de arquitetura
        run: npm run boundaries

      # Inclui os testes de política: as proibições da Bíblia Cap. 1 §1.6.
      - name: Testes
        run: npm run test

      # Conteúdo quebrado não dá erro de compilação — dá tela travada na frente
      # de uma criança. Este passo é o compilador do conteúdo.
      - name: Validar conteúdo
        run: npm run content:validate

  integracao:
    name: Integração com Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres de verdade. Os testes de `application/` provam a regra com
    # dublês; estes provam o que dublê nenhum alcança — SQL, transações,
    # enums e o filtro de guarda dentro do `where`.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      # Aplica a migration que existe. Nunca gerar outra aqui: divergência
      # entre migration e schema tem que quebrar o CI, não ser corrigida por ele.
      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Testes de integração
        run: npm run test:integration

  e2e:
    name: Jogada completa no navegador
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ── Por que este job existe ──
    # Três defeitos chegaram à tela sem que um único teste falhasse: uma
    # pergunta que apontava para conchas que não estavam lá, a resposta certa
    # marcada como errada, e a resposta entregue no erro. Os três eram
    # invisíveis para teste de unidade porque cada peça estava correta
    # isoladamente. Este job faz a pergunta que faltava: dá para jogar?
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy

      # Só o Chromium: a criança joga num navegador, e baixar três triplica o
      # tempo do job sem cobrir mais nada do que importa aqui.
      - name: Instalar o navegador
        run: npx playwright install --with-deps chromium

      # O e2e roda contra o build de produção — é o que a criança acessa.
      - run: npm run build

      - name: Jogada completa
        run: npm run test:e2e

      # Rastro e captura só existem quando algo falhou. É o que permite ver a
      # tela exata em que a jogada quebrou, sem reproduzir na mão.
      - name: Guardar o rastro da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    name: Build de produção
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
